
name: Jaz3D Android Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jaz3d-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/*.gradle*
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Verify Gradle launcher and configuration
        working-directory: android
        run: |
          if [ ! -f ./gradlew ]; then
            echo "::error::android/gradlew is missing."
            exit 1
          fi

          if [ ! -f ./gradle/wrapper/gradle-wrapper.properties ]; then
            echo "::error::Gradle wrapper properties are missing."
            exit 1
          fi

          chmod +x ./gradlew

      - name: Compile Kotlin and report errors
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain compileDebugKotlin 2>&1 | tee kotlin-build.log

      - name: Build debug APK
        if: success()
        working-directory: android
        run: ./gradlew --no-daemon --console=plain assembleDebug

      - name: Upload Kotlin diagnostic log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Jaz3D-kotlin-build-log
          path: android/kotlin-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Jaz3D-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
